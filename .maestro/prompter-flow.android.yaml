appId: com.altixcode.syncprompt
name: Load a script and open the prompter (Android)
---
# Same contract as the iOS flow. The voice tracking itself is not exercised
# here or there: it needs a camera and a microphone hearing real speech, which
# neither a simulator nor an emulator provides. What is gated is everything up
# to it -- that the script loads, the permissions path is taken, and the
# prompter renders the script rather than an empty screen.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: ".*Use sample script.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: android-sp-filled
# scrollUntilVisible reports COMPLETED while only a sliver of the button is on
# screen, and the tap then resolves to its centre below the visible area. Swipe
# explicitly so the whole control is reachable.
- swipe:
    start: "50%,72%"
    end: "50%,28%"
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: ".*Start prompter.*"
- runFlow:
    when:
      visible: ".*(Allow|ALLOW|While using).*"
    commands:
      - tapOn: ".*(Allow|ALLOW|While using).*"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: ".*(Allow|ALLOW|While using).*"
          commands:
            - tapOn: ".*(Allow|ALLOW|While using).*"
- waitForAnimationToEnd:
    timeout: 8000
# Asserted on the script's own words, not just on the screen appearing. The
# prompter renders the same chrome whether it loaded the script or not, so a
# screenshot alone cannot tell a working prompter from an empty one -- and a
# permissions refusal puts a different screen here entirely, which this fails
# on rather than photographing.
- extendedWaitUntil:
    visible: ".*matches what you actually say.*"
    timeout: 20000
- takeScreenshot: android-sp-prompter
